name: Package Windows installer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-installer.yml'
      - 'installer/**'
      - 'README.md'
  workflow_run:
    workflows: ["Windows VST3 hybrid prototype build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Windows VST3 build run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  package:
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out installer scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve successful VST3 build run
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const requested = context.eventName === "workflow_run"
              ? context.payload.workflow_run.id
              : (context.eventName === "workflow_dispatch" ? core.getInput("build_run_id") : null);
            const candidates = requested
              ? [await github.rest.actions.getWorkflowRun({ owner: context.repo.owner, repo: context.repo.repo, run_id: Number(requested) }).then(r => r.data)]
              : (await github.rest.actions.listWorkflowRuns({ owner: context.repo.owner, repo: context.repo.repo, workflow_id: 423863336, branch: "main", per_page: 50 })).data.workflow_runs;
            for (const run of candidates) {
              if (run.status !== "completed" || run.conclusion !== "success" || run.head_branch !== "main") continue;
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({ owner: context.repo.owner, repo: context.repo.repo, run_id: run.id });
              if (data.artifacts.some(a => a.name === "VoiceMorph-VST3-ON" && !a.expired)) {
                core.setOutput("run_id", String(run.id));
                return;
              }
            }
            core.setFailed("No successful main-branch VST3 build with an unexpired Signalsmith ON artifact was found.");

      - name: Download Signalsmith ON VST3 build artifact
        uses: actions/download-artifact@v4
        with:
          name: VoiceMorph-VST3-ON
          path: downloaded
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Validate and stage VST3 bundle
        shell: pwsh
        run: |
          $matches = @(Get-ChildItem -Path downloaded -Directory -Recurse -Filter "VoiceMorph.vst3")
          if ($matches.Count -ne 1) {
            throw "Expected exactly one VoiceMorph.vst3 bundle, found $($matches.Count)."
          }

          $bundle = $matches[0].FullName
          $pluginBinary = Join-Path $bundle "Contents\x86_64-win\VoiceMorph.vst3"
          if (-not (Test-Path -LiteralPath $pluginBinary -PathType Leaf)) {
            throw "The x64 VST3 binary is missing from the bundle."
          }

          $forbidden = @(Get-ChildItem -LiteralPath $bundle -Recurse -File |
            Where-Object { $_.Extension -in @(".dll", ".exe") -or $_.FullName -match "(?i)rovee|the_pitch|gform|vocal_bender|t-de-esser" })
          if ($forbidden.Count -gt 0) {
            throw "Unexpected standalone or reference plug-in binary/name in payload: $($forbidden.FullName -join ', ')"
          }

          New-Item -ItemType Directory -Force -Path "installer\payload" | Out-Null
          Copy-Item -LiteralPath $bundle -Destination "installer\payload\VoiceMorph.vst3" -Recurse -Force

          $versionLine = Select-String -Path "CMakeLists.txt" -Pattern '^project\(VoiceMorph VERSION ([0-9]+\.[0-9]+\.[0-9]+)'
          if (-not $versionLine) { throw "Could not read VoiceMorph version from CMakeLists.txt." }
          $version = $versionLine.Matches[0].Groups[1].Value
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "Staged VoiceMorph $version bundle from successful Signalsmith ON build."

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $isccCandidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not installed in a known Inno Setup 6 location." }
          & $iscc "/DAppVersion=$env:APP_VERSION" "installer\VoiceMorph.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE." }

          $setup = "dist\VoiceMorph-Setup-x64-$env:APP_VERSION.exe"
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw "Installer output is missing." }
          if ((Get-Item -LiteralPath $setup).Length -lt 1MB) { throw "Installer is unexpectedly small." }
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne "NotSigned") {
            throw "Unexpected signing state ($($signature.Status)); review signing configuration."
          }
          Get-FileHash -Algorithm SHA256 -LiteralPath $setup | Format-List | Out-String | Write-Host

      - name: Smoke-test installer payload and uninstaller
        shell: pwsh
        run: |
          $setup = (Resolve-Path "dist\VoiceMorph-Setup-x64-$env:APP_VERSION.exe").Path
          $testVst3 = Join-Path $env:LOCALAPPDATA "Programs\Common\VST3\VoiceMorph.vst3"
          $installLog = Join-Path $env:RUNNER_TEMP "voicemorph-install.log"
          $install = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /LOG=$installLog" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            Get-Content -LiteralPath $installLog -Tail 50 -ErrorAction SilentlyContinue
            throw "Silent installer failed with exit code $($install.ExitCode)."
          }
          if (-not (Test-Path -LiteralPath $testVst3 -PathType Container)) {
            Get-Content -LiteralPath $installLog -Tail 50 -ErrorAction SilentlyContinue
            throw "Installer completed without creating the standard per-user VST3 bundle."
          }

          $expectedRoot = (Resolve-Path "installer\payload\VoiceMorph.vst3").Path
          $expectedFiles = @(Get-ChildItem -LiteralPath $expectedRoot -File -Recurse)
          $installedFiles = @(Get-ChildItem -LiteralPath $testVst3 -File -Recurse)
          if ($expectedFiles.Count -ne $installedFiles.Count) {
            throw "Installed bundle file count does not match the staged VST3 payload."
          }
          foreach ($file in $expectedFiles) {
            $relative = $file.FullName.Substring($expectedRoot.Length).TrimStart("\")
            $installed = Join-Path $testVst3 $relative
            if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) {
              throw "Installer payload is missing: $relative"
            }
            $expectedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash
            $installedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installed).Hash
            if ($expectedHash -ne $installedHash) { throw "Installer payload differs: $relative" }
          }

          $uninstaller = Join-Path $env:LOCALAPPDATA "VoiceMorph\Uninstall\unins000.exe"
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw "Installer did not create its uninstaller."
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstaller failed with exit code $($uninstall.ExitCode)." }
          if (Test-Path -LiteralPath $testVst3) { throw "Uninstaller left the test VST3 bundle behind." }

      - name: Upload versioned installer
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMorph-Setup-x64-${{ env.APP_VERSION }}
          path: dist/VoiceMorph-Setup-x64-${{ env.APP_VERSION }}.exe
          if-no-files-found: error
          retention-days: 90
