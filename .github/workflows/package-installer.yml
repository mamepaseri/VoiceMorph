name: Package Windows installer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-installer.yml'
      - 'installer/**'
      - 'README.md'
  workflow_run:
    workflows: ["Windows VST3 hybrid prototype build", "DSP tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Windows VST3 build run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: voicemorph-package-${{ github.event.workflow_run.head_sha || inputs.build_run_id || github.sha }}
  cancel-in-progress: false

jobs:
  package:
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out installer scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve successful VST3 build run
        id: source
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let windowsRuns = [];
            let matchingRuns = [];

            if (context.eventName === "workflow_dispatch") {
              const requested = core.getInput("build_run_id");
              const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: Number(requested) });
              if (run.status === "completed" && run.conclusion === "success" && run.head_branch === "main" &&
                  run.path.endsWith("windows-vst3-ui.yml")) {
                windowsRuns = [run];
                matchingRuns = (await github.rest.actions.listWorkflowRuns({
                  owner, repo, branch: "main", head_sha: run.head_sha, per_page: 100
                })).data.workflow_runs;
              }
            } else if (context.eventName === "workflow_run") {
              const eventRun = context.payload.workflow_run;
              matchingRuns = (await github.rest.actions.listWorkflowRuns({
                owner, repo, branch: "main", head_sha: eventRun.head_sha, per_page: 100
              })).data.workflow_runs;
              windowsRuns = matchingRuns.filter(run => run.path.endsWith("windows-vst3-ui.yml") &&
                run.status === "completed" && run.conclusion === "success" && run.head_branch === "main");
            } else {
              windowsRuns = (await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: "windows-vst3-ui.yml", branch: "main", per_page: 50
              })).data.workflow_runs.filter(run =>
                run.status === "completed" && run.conclusion === "success" && run.head_branch === "main");
            }

            if (context.eventName === "workflow_run" || context.eventName === "workflow_dispatch") {
              const dspPassed = matchingRuns.some(run => run.path.endsWith("dsp-tests.yml") &&
                run.status === "completed" && run.conclusion === "success" && run.head_branch === "main");
              if (!dspPassed) {
                core.setOutput("ready", "false");
                core.notice("Packaging is waiting for successful DSP tests on the same commit as the Windows VST3 build.");
                return;
              }
            }

            windowsRuns.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
            for (const run of windowsRuns) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: run.id });
              if (data.artifacts.some(a => a.name === "VoiceMorph-VST3-ON" && !a.expired)) {
                core.setOutput("ready", "true");
                core.setOutput("run_id", String(run.id));
                core.setOutput("head_sha", run.head_sha);
                return;
              }
            }

            core.setOutput("ready", "false");
            core.notice("No successful main-branch Windows VST3 build with an unexpired Signalsmith ON artifact is ready to package.");

      - name: Download Signalsmith ON VST3 build artifact
        if: steps.source.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: VoiceMorph-VST3-ON
          path: downloaded
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Validate and stage VST3 bundle
        if: steps.source.outputs.ready == 'true'
        shell: pwsh
        run: |
          $matches = @(Get-ChildItem -Path downloaded -Directory -Recurse -Filter "VoiceMorph.vst3")
          if ($matches.Count -ne 1) {
            throw "Expected exactly one VoiceMorph.vst3 bundle, found $($matches.Count)."
          }

          $bundle = $matches[0].FullName
          $pluginBinary = Join-Path $bundle "Contents\x86_64-win\VoiceMorph.vst3"
          if (-not (Test-Path -LiteralPath $pluginBinary -PathType Leaf)) {
            throw "The x64 VST3 binary is missing from the bundle."
          }

          $forbidden = @(Get-ChildItem -LiteralPath $bundle -Recurse -File |
            Where-Object { $_.Extension -in @(".dll", ".exe") -or $_.FullName -match "(?i)rovee|the_pitch|gform|vocal_bender|t-de-esser" })
          if ($forbidden.Count -gt 0) {
            throw "Unexpected standalone or reference plug-in binary/name in payload: $($forbidden.FullName -join ', ')"
          }

          New-Item -ItemType Directory -Force -Path "installer\payload" | Out-Null
          Copy-Item -LiteralPath $bundle -Destination "installer\payload\VoiceMorph.vst3" -Recurse -Force

          $versionLine = Select-String -Path "CMakeLists.txt" -Pattern '^project\(VoiceMorph VERSION ([0-9]+\.[0-9]+\.[0-9]+)'
          if (-not $versionLine) { throw "Could not read VoiceMorph version from CMakeLists.txt." }
          $version = $versionLine.Matches[0].Groups[1].Value
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "Staged VoiceMorph $version bundle from successful Signalsmith ON build."

      - name: Install Inno Setup
        if: steps.source.outputs.ready == 'true'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        if: steps.source.outputs.ready == 'true'
        shell: pwsh
        run: |
          $isccCandidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not installed in a known Inno Setup 6 location." }
          & $iscc "/DAppVersion=$env:APP_VERSION" "installer\VoiceMorph.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE." }

          $setup = "dist\VoiceMorph-Setup-x64-$env:APP_VERSION.exe"
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw "Installer output is missing." }
          if ((Get-Item -LiteralPath $setup).Length -lt 1MB) { throw "Installer is unexpectedly small." }
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne "NotSigned") {
            throw "Unexpected signing state ($($signature.Status)); review signing configuration."
          }
          Get-FileHash -Algorithm SHA256 -LiteralPath $setup | Format-List | Out-String | Write-Host

      - name: Smoke-test installer payload and uninstaller
        if: steps.source.outputs.ready == 'true'
        shell: pwsh
        run: |
          $setup = (Resolve-Path "dist\VoiceMorph-Setup-x64-$env:APP_VERSION.exe").Path
          $testVst3 = Join-Path $env:LOCALAPPDATA "Programs\Common\VST3\VoiceMorph.vst3"
          $installLog = Join-Path $env:RUNNER_TEMP "voicemorph-install.log"
          $install = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /LOG=$installLog" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            Get-Content -LiteralPath $installLog -Tail 50 -ErrorAction SilentlyContinue
            throw "Silent installer failed with exit code $($install.ExitCode)."
          }
          if (-not (Test-Path -LiteralPath $testVst3 -PathType Container)) {
            Get-Content -LiteralPath $installLog -Tail 50 -ErrorAction SilentlyContinue
            throw "Installer completed without creating the standard per-user VST3 bundle."
          }

          $expectedRoot = (Resolve-Path "installer\payload\VoiceMorph.vst3").Path
          $expectedFiles = @(Get-ChildItem -LiteralPath $expectedRoot -File -Recurse)
          $installedFiles = @(Get-ChildItem -LiteralPath $testVst3 -File -Recurse)
          if ($expectedFiles.Count -ne $installedFiles.Count) {
            throw "Installed bundle file count does not match the staged VST3 payload."
          }
          foreach ($file in $expectedFiles) {
            $relative = $file.FullName.Substring($expectedRoot.Length).TrimStart("\")
            $installed = Join-Path $testVst3 $relative
            if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) {
              throw "Installer payload is missing: $relative"
            }
            $expectedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash
            $installedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installed).Hash
            if ($expectedHash -ne $installedHash) { throw "Installer payload differs: $relative" }
          }

          $uninstaller = Join-Path $env:LOCALAPPDATA "VoiceMorph\Uninstall\unins000.exe"
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw "Installer did not create its uninstaller."
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstaller failed with exit code $($uninstall.ExitCode)." }
          if (Test-Path -LiteralPath $testVst3) { throw "Uninstaller left the test VST3 bundle behind." }

      - name: Check whether this version is already published
        id: release_gate
        if: steps.source.outputs.ready == 'true' && (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = "v" + process.env.APP_VERSION;
            const { data: sourceRun } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: Number(process.env.SOURCE_RUN_ID)
            });
            const { data: mainRef } = await github.rest.git.getRef({ owner, repo, ref: "heads/main" });
            if (sourceRun.head_sha !== mainRef.object.sha) {
              core.setOutput("publish", "false");
              core.notice("Release skipped because main has advanced beyond the validated build; the latest commit must pass CI first.");
              return;
            }
            let tagExists = false;
            try {
              await github.rest.git.getRef({ owner, repo, ref: "tags/" + tag });
              tagExists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (!tagExists) {
              core.setOutput("publish", "true");
              return;
            }

            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              if (release.draft) {
                core.setOutput("publish", "true");
                core.notice("Resuming the existing draft release for " + tag + ".");
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            core.setOutput("publish", "false");
            core.warning("Version " + tag + " was already published. Validation completed; no duplicate installer artifact or release was created.");

      - name: Upload versioned installer
        if: steps.release_gate.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMorph-Setup-x64-${{ env.APP_VERSION }}
          path: dist/VoiceMorph-Setup-x64-${{ env.APP_VERSION }}.exe
          if-no-files-found: error
          retention-days: 90

      - name: Create release archive
        if: steps.release_gate.outputs.publish == 'true'
        shell: pwsh
        run: |
          $setup = "dist\VoiceMorph-Setup-x64-$env:APP_VERSION.exe"
          $archive = "dist\VoiceMorph-Setup-x64-$env:APP_VERSION.zip"
          Compress-Archive -LiteralPath $setup -DestinationPath $archive -CompressionLevel Optimal -Force
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw "Release archive was not created." }

      - name: Publish new version to GitHub Releases
        if: steps.release_gate.outputs.publish == 'true'
        uses: actions/github-script@v7
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const version = process.env.APP_VERSION;
            const tag = "v" + version;
            const { data: sourceRun } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: Number(process.env.SOURCE_RUN_ID)
            });

            if (sourceRun.status !== "completed" || sourceRun.conclusion !== "success" ||
                sourceRun.head_branch !== "main" || !sourceRun.path.endsWith("windows-vst3-ui.yml")) {
              core.setFailed("Refusing to publish from a run that is not a successful main-branch Windows VST3 build.");
              return;
            }
            const { data: mainRef } = await github.rest.git.getRef({ owner, repo, ref: "heads/main" });
            if (sourceRun.head_sha !== mainRef.object.sha) {
              core.notice("Release skipped because main advanced while the installer was being validated.");
              return;
            }

            const fs = require("fs");
            const assetName = "VoiceMorph-Setup-x64-" + version + ".zip";
            const assetPath = "dist/" + assetName;
            if (!fs.existsSync(assetPath)) {
              core.setFailed("Release archive is missing: " + assetPath);
              return;
            }

            let release;
            let tagExists = false;
            try {
              await github.rest.git.getRef({ owner, repo, ref: "tags/" + tag });
              tagExists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (tagExists) {
              let existing;
              try {
                ({ data: existing } = await github.rest.repos.getReleaseByTag({ owner, repo, tag }));
              } catch (error) {
                if (error.status !== 404) throw error;
                core.warning("Release skipped: tag " + tag + " already exists without a GitHub Release. Existing tags are never reused.");
                return;
              }
              if (!existing.draft) {
                core.warning("Release skipped: tag " + tag + " already has a published release. Bump the CMake project version for a new release.");
                return;
              }
              release = existing;
            } else {
              try {
                const { data: created } = await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tag,
                  target_commitish: sourceRun.head_sha,
                  name: "VoiceMorph " + version,
                  body: "Automated Windows x64 VST3 installer for VoiceMorph " + version +
                    ".\n\nBuilt from commit " + sourceRun.head_sha +
                    " with the Signalsmith Stretch backend enabled. The installer is unsigned and Windows SmartScreen may show a warning. " +
                    "VoiceMorph remains an experimental prototype; see the README and LICENSING.md for limitations and JUCE licensing terms.",
                  draft: true,
                  prerelease: false,
                  generate_release_notes: false
                });
                release = created;
              } catch (createError) {
                if (createError.status === 422) {
                  core.warning("Release skipped: tag " + tag + " was created by another run. No existing tag was overwritten.");
                  return;
                }
                throw createError;
              }
            }

            const stats = fs.statSync(assetPath);
            const existingAsset = release.assets.find(asset => asset.name === assetName);
            if (!existingAsset) {
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name: assetName,
                data: fs.readFileSync(assetPath),
                headers: {
                  "content-type": "application/zip",
                  "content-length": stats.size
                }
              });
            }

            if (release.draft) {
              await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, draft: false });
            }
            core.notice("Published " + assetName + " to " + release.html_url);
